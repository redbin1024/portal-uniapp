<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D旋转轮播视频展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .demo-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }

        .demo-title {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .demo-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .carousel-3d {
            position: relative;
            width: 100%;
            height: 500px;
            perspective: 1000px;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-item {
            position: absolute;
            width: 350px;
            height: 400px;
            left: 50%;
            top: 50%;
            margin-left: -175px;
            margin-top: -200px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .carousel-item-content {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
            background: #fff;
            transform-style: preserve-3d;
        }

        .video-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .carousel-item:not(.active) .video-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #333;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .video-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 30px 20px 20px;
            color: white;
            z-index: 3;
        }

        .video-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .video-description {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            pointer-events: none;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .control-btn:hover {
            background: #ffffff;
            transform: scale(1.1);
        }

        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .indicator.active {
            background-color: #ffffff;
            transform: scale(1.2);
        }

        .indicator.video::after {
            content: '📹';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .feature {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            color: white;
        }

        .feature-icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <h1 class="demo-title">3D旋转轮播视频展示</h1>
        <p class="demo-subtitle">支持视频和图片的3D旋转轮播效果</p>
        
        <div class="carousel-3d" id="carousel">
            <div class="carousel-container" id="carouselContainer">
                <!-- 轮播项将通过JavaScript动态生成 -->
            </div>
            
            <div class="carousel-controls">
                <button class="control-btn" id="prevBtn">‹</button>
                <button class="control-btn" id="nextBtn">›</button>
            </div>
        </div>
        
        <div class="carousel-indicators" id="indicators">
            <!-- 指示器将通过JavaScript动态生成 -->
        </div>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">🎬</div>
                <div class="feature-title">视频支持</div>
                <div class="feature-desc">支持多种视频格式，自动播放控制</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔄</div>
                <div class="feature-title">3D旋转</div>
                <div class="feature-desc">流畅的3D旋转动画效果</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📱</div>
                <div class="feature-title">触摸支持</div>
                <div class="feature-desc">支持触摸滑动和点击操作</div>
            </div>
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">自动轮播</div>
                <div class="feature-desc">可配置的自动轮播功能</div>
            </div>
        </div>
    </div>

    <script>
        class VideoRotateCarousel {
            constructor(container, options = {}) {
                this.container = container;
                this.carouselContainer = container.querySelector('#carouselContainer');
                this.indicatorsContainer = container.querySelector('#indicators');
                this.prevBtn = container.querySelector('#prevBtn');
                this.nextBtn = container.querySelector('#nextBtn');
                
                this.options = {
                    autoplay: true,
                    interval: 5000,
                    radius: 300,
                    maxAngle: 45,
                    ...options
                };
                
                this.currentIndex = 0;
                this.items = [];
                this.timer = null;
                
                this.init();
            }
            
            init() {
                // 示例数据
                this.items = [
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/mov_bbb.mp4',
                        poster: 'https://picsum.photos/350/400?random=1',
                        title: '示例视频 1',
                        description: '这是一个示例视频，展示3D轮播效果'
                    },
                    {
                        type: 'image',
                        src: 'https://picsum.photos/350/400?random=2',
                        title: '示例图片 1',
                        description: '美丽的风景图片'
                    },
                    {
                        type: 'video',
                        src: 'https://www.w3schools.com/html/movie.mp4',
                        poster: 'https://picsum.photos/350/400?random=3',
                        title: '示例视频 2',
                        description: '另一个精彩的视频内容'
                    },
                    {
                        type: 'image',
                        src: 'https://picsum.photos/350/400?random=4',
                        title: '示例图片 2',
                        description: '精美的设计作品'
                    },
                    {
                        type: 'image',
                        src: 'https://picsum.photos/350/400?random=5',
                        title: '示例图片 3',
                        description: '创意摄影作品'
                    }
                ];
                
                this.createItems();
                this.createIndicators();
                this.bindEvents();
                this.updateCarousel();
                this.startAutoplay();
            }
            
            createItems() {
                this.carouselContainer.innerHTML = '';
                
                this.items.forEach((item, index) => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'carousel-item';
                    itemElement.dataset.index = index;
                    
                    let content = '';
                    if (item.type === 'video') {
                        content = `
                            <div class="video-container">
                                <video class="video-player" poster="${item.poster}" muted loop>
                                    <source src="${item.src}" type="video/mp4">
                                </video>
                                <div class="video-overlay">
                                    <div class="play-icon">▶</div>
                                </div>
                                <div class="video-info">
                                    <div class="video-title">${item.title}</div>
                                    <div class="video-description">${item.description}</div>
                                </div>
                            </div>
                        `;
                    } else {
                        content = `
                            <div class="video-container">
                                <img class="video-player" src="${item.src}" alt="${item.title}">
                                <div class="video-info">
                                    <div class="video-title">${item.title}</div>
                                    <div class="video-description">${item.description}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    itemElement.innerHTML = `
                        <div class="carousel-item-content">
                            ${content}
                        </div>
                    `;
                    
                    this.carouselContainer.appendChild(itemElement);
                });
            }
            
            createIndicators() {
                this.indicatorsContainer.innerHTML = '';
                
                this.items.forEach((item, index) => {
                    const indicator = document.createElement('div');
                    indicator.className = `indicator ${item.type}`;
                    indicator.dataset.index = index;
                    indicator.addEventListener('click', () => this.goToIndex(index));
                    this.indicatorsContainer.appendChild(indicator);
                });
            }
            
            bindEvents() {
                this.prevBtn.addEventListener('click', () => this.prev());
                this.nextBtn.addEventListener('click', () => this.next());
                
                // 触摸事件
                let startX = 0;
                this.container.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    this.stopAutoplay();
                });
                
                this.container.addEventListener('touchend', (e) => {
                    const endX = e.changedTouches[0].clientX;
                    const diff = startX - endX;
                    
                    if (Math.abs(diff) > 50) {
                        if (diff > 0) {
                            this.next();
                        } else {
                            this.prev();
                        }
                    }
                    
                    this.startAutoplay();
                });
                
                // 点击轮播项
                this.carouselContainer.addEventListener('click', (e) => {
                    const item = e.target.closest('.carousel-item');
                    if (item) {
                        const index = parseInt(item.dataset.index);
                        if (index === this.currentIndex) {
                            // 点击当前项，播放视频
                            const video = item.querySelector('video');
                            if (video) {
                                if (video.paused) {
                                    video.play();
                                } else {
                                    video.pause();
                                }
                            }
                        } else {
                            // 点击其他项，切换到该项
                            this.goToIndex(index);
                        }
                    }
                });
            }
            
            updateCarousel() {
                const items = this.carouselContainer.querySelectorAll('.carousel-item');
                const indicators = this.indicatorsContainer.querySelectorAll('.indicator');
                
                items.forEach((item, index) => {
                    const relativeIndex = (((index - this.currentIndex + this.items.length) % this.items.length) + this.items.length) % this.items.length;
                    
                    let angle;
                    if (relativeIndex <= this.items.length / 2) {
                        angle = relativeIndex * this.options.maxAngle;
                    } else {
                        angle = (relativeIndex - this.items.length) * this.options.maxAngle;
                    }
                    
                    const angleAbs = Math.abs(angle);
                    const scaleIndex = Math.cos((angleAbs * Math.PI) / 180);
                    const opacity = angleAbs <= 90 ? scaleIndex * 0.3 + 0.7 : 0.1;
                    const scale = scaleIndex * 0.2 + 0.8;
                    
                    item.style.transform = `rotateY(${angle}deg) translateZ(${this.options.radius}px) scale(${scale})`;
                    item.style.zIndex = Math.floor((1 - angleAbs / 180) * 100);
                    item.style.opacity = opacity;
                    
                    // 更新active状态
                    if (index === this.currentIndex) {
                        item.classList.add('active');
                        const video = item.querySelector('video');
                        if (video && this.options.autoplay) {
                            video.play().catch(() => {});
                        }
                    } else {
                        item.classList.remove('active');
                        const video = item.querySelector('video');
                        if (video) {
                            video.pause();
                        }
                    }
                });
                
                // 更新指示器
                indicators.forEach((indicator, index) => {
                    if (index === this.currentIndex) {
                        indicator.classList.add('active');
                    } else {
                        indicator.classList.remove('active');
                    }
                });
            }
            
            prev() {
                this.currentIndex = (this.currentIndex - 1 + this.items.length) % this.items.length;
                this.updateCarousel();
            }
            
            next() {
                this.currentIndex = (this.currentIndex + 1) % this.items.length;
                this.updateCarousel();
            }
            
            goToIndex(index) {
                if (index >= 0 && index < this.items.length && index !== this.currentIndex) {
                    this.currentIndex = index;
                    this.updateCarousel();
                    this.stopAutoplay();
                    this.startAutoplay();
                }
            }
            
            startAutoplay() {
                if (!this.options.autoplay) return;
                this.stopAutoplay();
                this.timer = setInterval(() => {
                    this.next();
                }, this.options.interval);
            }
            
            stopAutoplay() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }
        }
        
        // 初始化轮播
        document.addEventListener('DOMContentLoaded', () => {
            const carousel = new VideoRotateCarousel(document.getElementById('carousel'), {
                autoplay: true,
                interval: 4000,
                radius: 300,
                maxAngle: 45
            });
        });
    </script>
</body>
</html>
